name: Security

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:
  # Scan immediately when the pipeline or policy itself changes. Also required
  # once: GitHub only registers a workflow (making workflow_dispatch possible)
  # after an event runs it or it reaches the default branch.
  push:
    branches: [next]
    paths:
      - ".github/workflows/security.yml"
      - "deny.toml"
      - "osv-scanner.toml"

permissions:
  contents: read
  issues: write

env:
  # Same version as the local install; keep both in sync when bumping.
  OSV_SCANNER_VERSION: "2.4.0"
  OSV_SCANNER_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"

jobs:
  scan:
    name: Scan (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, next]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ matrix.branch }}

      # Bootstrap: main carries no security policy (deny.toml/osv-scanner.toml)
      # until the first release merge - the branch model only ever writes main
      # via the release script, and pre-release there is nothing to hotfix.
      # Skip both scans with a notice instead of failing; resolves itself once
      # next is first released to main.
      - name: Check policy presence
        id: policy
        run: |
          if [ -f deny.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.branch }} carries no security policy yet - scans skipped (expected until the first release merge)"
          fi

      - name: cargo-deny check
        if: steps.policy.outputs.present == 'true'
        run: |
          cargo install --locked cargo-deny
          cargo deny check -W unmaintained

      - name: osv-scanner
        if: steps.policy.outputs.present == 'true'
        run: |
          curl -sSLf -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=Cargo.lock

  report:
    name: File findings issue
    needs: scan
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ensure security-scan label exists
        run: gh label create security-scan --color B60205 --description "Weekly dependency security scan findings" --force

      - name: File or update collector issue
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --label security-scan --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "New failing run: $RUN_URL"
          else
            gh issue create --title "Weekly security scan: findings to triage" --label security-scan --body "New failing run: $RUN_URL"
          fi
