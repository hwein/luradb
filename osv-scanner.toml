# Ignore list for `osv-scanner scan source --lockfile=Cargo.lock` (OSV/GHSA/RustSec).
# Same invocation locally and in CI: see .github/workflows/security.yml.
#
# Companion file: deny.toml (cargo-deny policy). Advisory exceptions needed by
# both tools must be kept in sync between the two files.
#
# review by 2026-11-17 (or earlier when the axum 0.8 / utoipa-swagger-ui upgrade lands)
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
reason = "zip is a build-only dependency of utoipa-swagger-ui, whose build script extracts the upstream swagger-ui archive; it is not linked into the luradb binary and never extracts untrusted archives"

