name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'self-hosted' }}
    # Internal reference pattern shared by the file and commit-message gates.
    # The section sign is written as an escape so this file does not match itself.
    env:
      INTERNAL_REFS: "\\b(general|perf|kv|json|dist|rel|quality)/[0-9]{3}|\\b(spec|concept) [0-9]{3}\\b|\u00a7"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0

      - name: No internal references or marker lines
        run: |
          ! git grep -nE "$INTERNAL_REFS"'|^\s*(//[/!]?|#)\s*(-|=|\*|#|─){3,}\s*$|^\s*(//[/!]?|#)\s*(-|=|\*|─){2,}\s*[^-=*[:space:]].*\s(-|=|\*|─){2,}\s*$' -- . ':!CHANGELOG.md'

      # Commits up to the baseline below predate this rule and history is
      # not rewritten, so only later commits are checked.
      - name: No internal references in commit messages
        run: |
          commits=$(git rev-list e924dc8a1295036b8f66431a92145cf45adfb805..HEAD)
          fail=0
          for c in $commits; do
            if grep -qE "$INTERNAL_REFS" <<< "$(git log -1 --format=%B "$c")"; then
              git log -1 --format='%H %s' "$c"
              fail=1
            fi
          done
          exit "$fail"

      # io_uring needs a VM, not a container (Docker's default seccomp
      # blocks it); uname -r logs the kernel the tests ran on. Fork PRs run
      # on fresh GitHub-hosted machines so outside code never reaches a
      # persistent one.
      - name: Log kernel version
        run: uname -r

      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      # A persistent runner keeps its own rustup in ~/.cargo/bin; caching
      # that directory would prune it after the job.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          cache-bin: false

      - name: cargo check --tests
        run: cargo check --tests

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # The in-process server tests run once more with two data shards.
      - name: cargo test (two data shards)
        run: cargo test
        env:
          LURADB_TEST_SHARDS: "2"

  deny:
    name: cargo-deny
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: cargo-deny check
        run: |
          cargo install --locked cargo-deny
          cargo deny check -W unmaintained
