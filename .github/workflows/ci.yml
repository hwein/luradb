name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      # The section sign is written as bytes so this file does not match itself.
      - name: No internal spec references
        run: |
          ! git grep -nE '\b(general|perf|kv|json|dist|rel|quality)/[0-9]{3}|\b(spec|concept) [0-9]{3}\b|'$'\xc2\xa7' -- . ':!CHANGELOG.md'

      # io_uring needs the runner VM, not a container (Docker's default
      # seccomp blocks it) - uname -r is the acceptance proof.
      - name: Log kernel version
        run: uname -r

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show

      # A persistent runner keeps its own rustup in ~/.cargo/bin; caching
      # that directory would prune it after the job.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          cache-bin: false

      - name: cargo check --tests
        run: cargo check --tests

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # The in-process server tests run once more with two data shards.
      - name: cargo test (two data shards)
        run: cargo test
        env:
          LURADB_TEST_SHARDS: "2"

  deny:
    name: cargo-deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: cargo-deny check
        run: |
          cargo install --locked cargo-deny
          cargo deny check -W unmaintained
