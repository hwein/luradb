name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Same version as security.yml / the local install; keep in sync.
  OSV_SCANNER_VERSION: "2.4.0"
  OSV_SCANNER_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"

jobs:
  gate:
    name: Consistency gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      deb_version: ${{ steps.derive.outputs.deb_version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0

      # actions/checkout recreates the local tag ref as lightweight (points
      # at the commit, not the tag object) - re-fetch to restore the real
      # object before checking annotation (actions/checkout#290).
      - name: Restore real tag objects
        run: git fetch --tags --force

      - name: Derive version, check consistency triple
        id: derive
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"; KIND=final
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"; KIND=rc
          else
            echo "::error::tag '$TAG' matches neither vX.Y.Z nor vX.Y.Z-rc.N"
            exit 1
          fi

          TAG_TYPE=$(git cat-file -t "refs/tags/$TAG")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::tag $TAG is not annotated (object type: $TAG_TYPE)"
            exit 1
          fi

          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | sed -E 's/version *= *"([^"]*)"/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) != tag version ($VERSION)"
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$KIND" = final ]; then
            LATEST=$(scripts/changelog-extract.sh --latest-version)
            if [ "$LATEST" != "$VERSION" ]; then
              echo "::error::changelog latest version ($LATEST) != tag version ($VERSION)"
              exit 1
            fi
            git merge-base --is-ancestor "$TAG_COMMIT" origin/main
          else
            scripts/changelog-extract.sh unreleased >/dev/null
            git merge-base --is-ancestor "$TAG_COMMIT" origin/next
          fi

          DEB_VERSION="${VERSION/-rc./~rc.}"
          {
            echo "version=$VERSION"
            echo "deb_version=$DEB_VERSION"
            echo "prerelease=$([ "$KIND" = rc ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      # io_uring needs the runner VM, not a container (Docker's default
      # seccomp blocks it) - uname -r is the acceptance proof.
      - name: Log kernel version
        run: uname -r

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: cargo check --tests
        run: cargo check --tests

      - name: cargo test
        run: cargo test

  security:
    name: Security & SBOM
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: cargo-deny check
        run: |
          cargo install --locked cargo-deny
          cargo deny check -W unmaintained

      - name: osv-scanner
        run: |
          curl -sSLf -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=Cargo.lock

      - name: Generate SBOM
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json
          mv luradb.cdx.json "luradb-${{ needs.gate.outputs.version }}.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: luradb-${{ needs.gate.outputs.version }}.cdx.json
          if-no-files-found: error

  build-deb:
    name: Build .deb (glibc 2.35 baseline)
    needs: gate
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    defaults:
      run:
        # Container jobs default to sh (dash); our steps need bash.
        shell: bash
    steps:
      # Bare image: no git/curl/build tools until installed.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential dpkg-dev

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb

      - name: cargo deb
        run: cargo deb

      - name: Verify package version
        run: |
          set -euo pipefail
          PKG_VERSION=$(dpkg-deb -f target/debian/luradb_*.deb Version)
          # Control version carries the Debian revision (e.g. 0.1.0~rc.1-1) -
          # compare the upstream part only.
          if [ "${PKG_VERSION%-*}" != "${{ needs.gate.outputs.deb_version }}" ]; then
            echo "::error::package version ($PKG_VERSION) != expected (${{ needs.gate.outputs.deb_version }} + revision)"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: deb
          path: target/debian/luradb_*.deb
          if-no-files-found: error

  smoke:
    name: Install smoke test
    needs: [build-deb, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: deb

      - name: Install package
        run: |
          sudo apt-get update
          sudo apt install -y ./luradb_*.deb

      - name: Wait for service to come up
        run: |
          set -euo pipefail
          CODE=""
          for _ in $(seq 1 15); do
            if systemctl is-active --quiet luradb; then
              CODE=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health || echo 000)
              [ "$CODE" = "200" ] && break
            fi
            sleep 1
          done
          systemctl is-active luradb
          [ "$CODE" = "200" ]

      - name: Version handshake
        run: |
          set -euo pipefail
          ADMIN_KEY=$(sudo sed -n 's/.*api_key = "\(lura_[^"]*\)".*/\1/p' /etc/luradb/luradb.toml)
          SERVER_VERSION=$(curl -fsS -H "Authorization: Bearer ${ADMIN_KEY}" http://127.0.0.1:3000/version | jq -r .server_version)
          echo "server_version=${SERVER_VERSION}"
          if [ "$SERVER_VERSION" != "${{ needs.gate.outputs.version }}" ]; then
            echo "::error::server_version ($SERVER_VERSION) != expected (${{ needs.gate.outputs.version }})"
            exit 1
          fi

      - name: Stop service
        run: |
          sudo systemctl stop luradb
          sudo journalctl -u luradb --no-pager -n 50

  publish:
    name: Publish release
    needs: [gate, test, security, smoke]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: deb

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sbom

      - name: Checksums
        run: sha256sum luradb_*.deb "luradb-${VERSION}.cdx.json" > SHA256SUMS

      # Attestations are unavailable on user-owned private repos - skipped
      # until the repository goes public.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: luradb_*.deb

      - name: Release notes
        run: |
          set -euo pipefail
          if [ "${{ needs.gate.outputs.prerelease }}" = "true" ]; then
            { echo "Release candidate — unreleased changelog snapshot"; echo; scripts/changelog-extract.sh unreleased; } > notes.md
          else
            scripts/changelog-extract.sh "${VERSION}" > notes.md
          fi

      - name: Create GitHub release
        run: |
          set -euo pipefail
          FLAGS=()
          [ "${{ needs.gate.outputs.prerelease }}" = "true" ] && FLAGS+=(--prerelease)
          gh release create "${{ github.ref_name }}" \
            --title "LuraDB ${{ github.ref_name }}" \
            --notes-file notes.md \
            "${FLAGS[@]}" \
            luradb_*.deb "luradb-${VERSION}.cdx.json" SHA256SUMS
