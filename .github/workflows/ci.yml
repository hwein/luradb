name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      # io_uring needs the runner VM, not a container (Docker's default
      # seccomp blocks it) - uname -r is the acceptance proof.
      - name: Log kernel version
        run: uname -r

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show

      # A persistent runner keeps its own rustup in ~/.cargo/bin; caching
      # that directory would prune it after the job.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          cache-bin: false

      - name: cargo check --tests
        run: cargo check --tests

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  deny:
    name: cargo-deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: cargo-deny check
        run: |
          cargo install --locked cargo-deny
          cargo deny check -W unmaintained
