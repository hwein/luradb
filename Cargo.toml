[package]
name = "luradb"
version = "0.2.1-dev"
edition = "2021"
authors = ["Heiko Wein"]
description = "LuraDB: A Linux-first, REST-native multi-model database"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hwein/luradb"
readme = "README.md"
# We optimize for Linux
exclude = ["/.github/**", "/docs/**"]

[dependencies]
# --- Core: Async Runtime & Web Interface ---
# Axum is our "driver"
axum = { version = "0.7", features = ["macros", "http2"] }
# Direct access to the HTTP conn machinery for the UDS listener (perf/001);
# both are already transitive dependencies of Axum.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
# Native HTTPS listener (spec general/011); rustls itself comes as a re-export
# via tokio_rustls::rustls (default provider: aws-lc-rs).
tokio-rustls = "0.26"
rustls-pemfile = "2"
utoipa = { version = "5", features = ["axum_extras"] }
# 8.1.0 is the last utoipa-swagger-ui version before the axum-0.8 jump (9.x) — matches utoipa 5 + axum 0.7.
utoipa-swagger-ui = { version = "8.1.0", features = ["axum"] }
# Tokio as the base runtime (required by Axum)
tokio = { version = "1", features = ["full"] }
# Middleware for tracing and CORS
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "fs"] }

# --- The "Lura" Power: Linux I/O ---
# The heart of it: asynchronous I/O via io_uring
tokio-uring = "0.5"
# Raw io_uring ring for the SQPOLL storage thread (perf/005).
io-uring = "0.6"
# For low-level flags like O_DIRECT and mmap (shared memory)
libc = "0.2"
# Efficient byte handling for zero-copy strategies
bytes = "1.5"

# --- Storage & Data Engines ---
# Serde for everything (JSON engine & API responses)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Memmap2 for shared-memory access
memmap2 = "0.9"
# rkyv for zero-copy deserialization. `little_endian` pins the archived byte
# order across architectures; validation (bytecheck) is a default feature.
rkyv = { version = "0.8.17", features = ["little_endian"] }

# --- Concurrency & Safety ---
# DashMap for high-performance, lock-free maps in RAM
dashmap = "5.5"
crossbeam-skiplist = "0.1"
crossbeam-utils = "0.8"
parking_lot = "0.12"

# --- Utils ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"
# TOML config file parsing
toml = "0.8"
# CLI Argument Parsing (Server start port etc.)
clap = { version = "4", features = ["derive"] }
futures = "0.3.31"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
# Benchmark harness (perf/011).
# "async" (not "async_tokio") so criterion doesn't pull its own separate tokio
# dependency — we supply our own AsyncExecutor wrapping the project's runtime.
criterion = { version = "0.5", features = ["html_reports", "async"] }
# Client-side features for the IPC benchmark's hyper HTTP client (TCP + UDS).
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1"] }

[[bench]]
name = "ipc_bench"
harness = false

[package.metadata.deb]
maintainer = "Heiko Wein <heiko.wein.hw@gmail.com>"
copyright = "2026 Heiko Wein"
license-file = ["LICENSE.md", "0"]
extended-description = """\
Linux-first, REST-native multi-model database (key-value + JSON documents)
built on io_uring. Runs as a systemd service; configuration in /etc/luradb,
data in /var/lib/luradb, logs via journald."""
section = "database"
priority = "optional"
depends = "$auto, adduser"
maintainer-scripts = "packaging/deb"
systemd-units = { unit-scripts = "packaging", enable = true, start = true }
assets = [
    ["target/release/luradb", "usr/bin/", "755"],
    ["packaging/luradb.toml", "etc/luradb/luradb.toml", "640"],
    ["README.md", "usr/share/doc/luradb/README.md", "644"],
    ["packaging/INSTALL.md", "usr/share/doc/luradb/INSTALL.md", "644"],
]
conf-files = ["/etc/luradb/luradb.toml"]
