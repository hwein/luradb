name: nightly-review

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC every night
  workflow_dispatch:        # manual start for testing

permissions:
  contents: write   # move the review/last marker tag
  issues: write     # create issues and labels

concurrency:
  group: nightly-review
  cancel-in-progress: false

jobs:
  review:
    # GitHub-hosted on purpose: a fresh, stateless machine for every run.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.REVIEW_GH_TOKEN || secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_COMMITS: "20"   # at most this many commits per night; the rest follow the next night
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 0
          fetch-tags: true

      # The prompt comes from the branch the workflow runs from (the default branch, main),
      # not from the reviewed code on next: commits on next cannot change the instructions.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: .review-config
          sparse-checkout: .github/review

      - name: Determine unreviewed commits
        id: range
        run: |
          git fetch origin main next --tags
          if git rev-parse -q --verify refs/tags/review/last >/dev/null \
             && git merge-base --is-ancestor review/last origin/next; then
            base=review/last
          else
            # First run, or next was rewritten: start where next and main diverge.
            base=$(git merge-base origin/main origin/next)
          fi
          # Oldest first, only commits that are not in main yet.
          git rev-list --reverse --no-merges "$base..origin/next" --not origin/main \
            | head -n "$MAX_COMMITS" > /tmp/commits.txt
          echo "count=$(wc -l < /tmp/commits.txt)" >> "$GITHUB_OUTPUT"
          echo "last=$(tail -n1 /tmp/commits.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/commits.txt

      - name: Labels
        if: steps.range.outputs.count != '0'
        run: |
          gh label create review-finding  --color 5319e7 --force
          gh label create severity:high   --color b60205 --force
          gh label create severity:medium --color fbca04 --force
          gh label create severity:low    --color c2e0c6 --force

      - uses: dtolnay/rust-toolchain@stable
        if: steps.range.outputs.count != '0'
      - uses: Swatinem/rust-cache@v2
        if: steps.range.outputs.count != '0'

      - name: Install Claude Code
        if: steps.range.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Review
        if: steps.range.outputs.count != '0'
        run: |
          prompt="$(cat .review-config/.github/review/nightly-review.md)

          Commits to review (oldest first):
          $(cat /tmp/commits.txt)"
          claude -p "$prompt" \
            --model claude-opus-5-5 \
            --max-turns 400 \
            --max-budget-usd 25 \
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(gh:*),Bash(cargo:*),Bash(ls:*),Bash(wc:*)" \
            --output-format json > /tmp/review.json
          jq -r '.result' /tmp/review.json >> "$GITHUB_STEP_SUMMARY"

      # Only after a successful review: the next night starts after this commit.
      # review/last is a progress marker, not a release tag; it is recreated instead of force-pushed.
      - name: Move marker
        if: success() && steps.range.outputs.count != '0'
        run: |
          git tag -f review/last "${{ steps.range.outputs.last }}"
          git push origin :refs/tags/review/last || true
          git push origin refs/tags/review/last
