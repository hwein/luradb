# The engine thread runs a compio runtime inside the frontend runtime's tokio
# handle: a tokio spawn or timer there would quietly land on the
# frontend runtime. Frontend and reader-pool code allows them where it runs.
disallowed-methods = [
    { path = "tokio::spawn", reason = "engine-thread tasks use compio::runtime::spawn" },
    { path = "tokio::task::spawn_local", reason = "engine-thread tasks use compio::runtime::spawn" },
    { path = "tokio::task::JoinSet::spawn", reason = "engine-thread tasks use compio::runtime::spawn" },
    { path = "tokio::time::sleep", reason = "engine-thread timers use compio::time" },
    { path = "tokio::time::sleep_until", reason = "engine-thread timers use compio::time" },
    { path = "tokio::time::timeout", reason = "engine-thread timers use compio::time" },
    { path = "tokio::time::timeout_at", reason = "engine-thread timers use compio::time" },
    { path = "tokio::time::interval", reason = "engine-thread timers use compio::time" },
    { path = "tokio::time::interval_at", reason = "engine-thread timers use compio::time" },
]
