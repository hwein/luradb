# Ignore list for `osv-scanner scan source --lockfile=Cargo.lock` (OSV/GHSA/RustSec).
# Same invocation locally and in CI: see .github/workflows/security.yml.
#
# Companion file: deny.toml (cargo-deny policy). Advisory exceptions needed by
# both tools must be kept in sync between the two files.
#
# review by 2027-02-05 (or earlier when a loom release drops pin-utils)
[[IgnoredVulns]]
id = "RUSTSEC-2026-0441"
reason = "pin-utils is only reachable through loom, which compio and synchrony depend on under cfg(loom) for their own model tests; it is never compiled into the luradb binary, and every loom release still depends on it"
